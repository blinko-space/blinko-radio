<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Blinko Radio</title>
  <style>

      radial-gradient(circle at 8% 0%, rgba(255,255,255,.68), transparent 34%),
      radial-gradient(circle at 95% 14%, rgba(194,178,255,.28), transparent 43%),
      linear-gradient(145deg, rgba(248,232,215,.78) 0%, rgba(242,220,226,.76) 51%, rgba(229,224,247,.78) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35); backdrop-filter: blur(24px) saturate(135%); -webkit-backdrop-filter: blur(24px) saturate(135%); }

    .artwork-backdrop { position: absolute; z-index: 0; inset: 0; overflow: hidden; pointer-events: none; }
    .artwork-layer { position: absolute; inset: -18%; background-position: center; background-size: cover; filter: blur(34px) saturate(.88); opacity: 0; transform: scale(1.08); transition: opacity .26s cubic-bezier(.23,1,.32,1); }

    .volume-popover input::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -5px; appearance: none; -webkit-appearance: none; border: 2px solid rgba(255,255,255,.9); border-radius: 50%; background: #35303a; box-shadow: 0 2px 7px rgba(39,35,44,.26); }

<body>
  <main class="player" id="player">

        <button class="control" id="previous" aria-label="Previous station"><svg viewBox="0 0 24 24"><path d="M7.5 7v10m9-9.2-6 4.2 6 4.2V7.8Z"/></svg></button>

    <section class="favorites-panel" id="favoritesPanel">

      <div class="favorites-list" id="favoritesList"></div>
    </section>
  </main>

      let artworkIndex = 0;

      const renderGenres = () => { el.genres.replaceChildren(...CATEGORIES.map(([id,labelKey]) => { const button = document.createElement("button"); button.className = `genre${id === state.category ? " active" : ""}`; button.textContent = t(labelKey); button.onclick = async () => { if (id === state.category) return; state.category = id; audio.pause(); state.playing = false; updatePlayback(); renderGenres(); setStatus("loading"); try { state.stations = await loadStations(id); chooseStation(state.stations[0], true, 1); setStatus("ready"); } catch { if (id !== "all") { state.category = "all"; renderGenres(); try { state.stations = await loadStations("all"); chooseStation(state.stations[0], true, 1); setStatus("showingAll"); } catch { setStatus("unavailable", true); } } } persist(); }; return button; })); };
      const chooseStation = (station, pushHistory = true, motionDirection = 0) => { if (!station) return; state.station = station; if (pushHistory) { state.history = state.history.slice(0, state.historyIndex + 1); state.history.push(station); state.historyIndex = state.history.length - 1; } el.name.textContent = station.name; el.meta.textContent = stationMeta(station); el.cover.alt = t("logo", { name: station.name }); el.cover.dataset.stationId = station.id; el.cover.src = station.favicon || ""; el.cover.style.display = station.favicon ? "block" : "none"; el.fallback.style.display = station.favicon ? "none" : "grid"; if (!station.favicon) setArtwork(""); el.favorite.classList.toggle("active", isFavorite(station)); if (motionDirection) animateIn(el.nowPlaying, motionDirection); if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: station.name, artist: [displayCountry(station), station.codec].filter(Boolean).join(" · "), artwork: station.favicon ? [{ src: station.favicon }] : [] }); bridge.state(state.playing, station.name); };

      const toggleFavorites = force => { state.favoritesOpen = typeof force === "boolean" ? force : !state.favoritesOpen; el.mainView.style.display = state.favoritesOpen ? "none" : "flex"; el.genres.style.display = state.favoritesOpen ? "none" : "flex"; el.favoritesPanel.classList.toggle("open", state.favoritesOpen); el.favoritesToggle.classList.toggle("active", state.favoritesOpen); if (state.favoritesOpen) renderFavorites(); animateIn(state.favoritesOpen ? el.favoritesPanel : el.mainView, state.favoritesOpen ? 1 : -1); };
      const updatePlayback = () => { el.playIcon.innerHTML = state.playing ? '<path d="M9 7.5v9m6-9v9"/>' : '<path d="m9.2 7.6 7.2 4.4-7.2 4.4V7.6Z"/>'; el.play.setAttribute("aria-label", `${state.playing ? t("pause") : t("play")} (${t("space")})`); el.player.classList.toggle("is-playing", state.playing); bridge.state(state.playing, state.station?.name || t("title")); };
      const stopSource = () => { audio.pause(); audio.removeAttribute("src"); audio.load(); };
      const playCurrent = async (attempt = 0) => { if (!state.station) return; const token = ++state.playToken; setStatus("connecting"); stopSource(); audio.src = state.station.url; audio.volume = state.volume; let timer; try { await Promise.race([audio.play(), new Promise((_, reject) => { timer = setTimeout(() => reject(new Error("STREAM_TIMEOUT")), 10000); })]); if (token !== state.playToken) return; state.playing = true; updatePlayback(); setStatus("live"); } catch (error) { if (token !== state.playToken) return; state.playing = false; updatePlayback(); stopSource(); if (error?.name === "NotAllowedError") { setStatus("pressPlay", true); return; } if (attempt < 2 && state.stations.length > 1) { chooseStation(randomStation()); return playCurrent(attempt + 1); } setStatus("streamFailed", true); } finally { clearTimeout(timer); } };

      let genreDrag; let suppressGenreClick = false;
      el.genres.addEventListener("pointerdown", event => { if (event.button !== 0) return; genreDrag = { id: event.pointerId, x: event.clientX, scrollLeft: el.genres.scrollLeft, moved: false, captured: false }; });
